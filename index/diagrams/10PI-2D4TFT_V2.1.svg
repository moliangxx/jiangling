<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" font-family="Noto Sans SC, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f9ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0c1e4d"/>
    </linearGradient>
    <linearGradient id="pcb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#166534"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
  </defs>

  <rect width="1500" height="1000" fill="url(#bg)"/>

  <text x="40" y="55" font-size="26" font-weight="700" fill="#0f172a">10PI-2D4TFT_V2.1 · 2.4寸 TFT 彩屏（ST7789 SPI）引脚功能图</text>
  <text x="40" y="85" font-size="15" fill="#475569">240×320 · SPI · 8Pin 排针 · 供电 3.3V（切勿接 5V）· 对接 ESP32-S3 开发板</text>

  <!-- PCB 主体 -->
  <rect x="200" y="140" width="1100" height="585" rx="10" fill="url(#pcb)" stroke="#166534" stroke-width="2"/>

  <text x="250" y="162" font-size="13" font-weight="700" fill="#86efac">▲ 屏幕面（正面朝上 · 排针朝下）</text>

  <!-- 屏幕 -->
  <rect x="250" y="175" width="1000" height="355" rx="6" fill="url(#screen)" stroke="#2563eb"/>
  <text x="750" y="340" font-size="22" font-weight="700" fill="#93c5fd" text-anchor="middle">240 × 320 显示区</text>
  <text x="750" y="372" font-size="14" fill="#60a5fa" text-anchor="middle">ST7789 驱动 IC · SPI 协议</text>

  <!-- 排针方向标注 -->
  <text x="750" y="548" font-size="12" font-weight="600" fill="#fbbf24" text-anchor="middle">▼ 排针（屏幕面视角 · 从左到右：BLK(8) → GND(1)）</text>

  <!-- 排针 8 格 -->
  <g font-size="13" font-weight="700">
    <rect x="250" y="558" width="112" height="46" rx="3" fill="#f97316"/>
    <text x="306" y="588" fill="#fff" text-anchor="middle">BLK</text>
    <rect x="362" y="558" width="112" height="46" rx="3" fill="#7c3aed"/>
    <text x="418" y="588" fill="#fff" text-anchor="middle">CS</text>
    <rect x="474" y="558" width="112" height="46" rx="3" fill="#7c3aed"/>
    <text x="530" y="588" fill="#fff" text-anchor="middle">DC</text>
    <rect x="586" y="558" width="112" height="46" rx="3" fill="#7c3aed"/>
    <text x="642" y="588" fill="#fff" text-anchor="middle">RESET</text>
    <rect x="698" y="558" width="112" height="46" rx="3" fill="#2563eb"/>
    <text x="754" y="588" fill="#fff" text-anchor="middle">SDA</text>
    <rect x="810" y="558" width="112" height="46" rx="3" fill="#2563eb"/>
    <text x="866" y="588" fill="#fff" text-anchor="middle">SCLK</text>
    <rect x="922" y="558" width="112" height="46" rx="3" fill="#fbbf24"/>
    <text x="978" y="588" fill="#0f172a" text-anchor="middle">3V3</text>
    <rect x="1034" y="558" width="112" height="46" rx="3" fill="#1e293b"/>
    <text x="1090" y="588" fill="#fff" text-anchor="middle">GND</text>
  </g>

  <!-- 引脚编号 -->
  <g font-size="11" font-weight="700">
    <text x="306" y="618" fill="#fde68a" text-anchor="middle">⑧</text>
    <text x="418" y="618" fill="#ddd6fe" text-anchor="middle">⑦</text>
    <text x="530" y="618" fill="#ddd6fe" text-anchor="middle">⑥</text>
    <text x="642" y="618" fill="#ddd6fe" text-anchor="middle">⑤</text>
    <text x="754" y="618" fill="#bfdbfe" text-anchor="middle">④</text>
    <text x="866" y="618" fill="#bfdbfe" text-anchor="middle">③</text>
    <text x="978" y="618" fill="#fde68a" text-anchor="middle">②</text>
    <text x="1090" y="618" fill="#e2e8f0" text-anchor="middle">①</text>
  </g>

  <!-- 功能说明 + 开发板接线 -->
  <g font-size="10.5" font-weight="600">
    <rect x="250" y="632" width="112" height="86" rx="4" fill="#ffedd5"/>
    <text x="306" y="650" fill="#7c2d12" text-anchor="middle">背光·高电平亮</text>
    <text x="306" y="668" fill="#7c2d12" text-anchor="middle">可 PWM 调光</text>
    <rect x="258" y="676" width="96" height="34" rx="3" fill="#fff7ed" stroke="#fb923c"/>
    <text x="306" y="690" font-size="10" font-weight="700" fill="#c2410c" text-anchor="middle">接开发板</text>
    <text x="306" y="703" font-size="11" font-weight="700" fill="#c2410c" text-anchor="middle">GPIO9</text>

    <rect x="362" y="632" width="112" height="86" rx="4" fill="#ede9fe"/>
    <text x="418" y="650" fill="#5b21b6" text-anchor="middle">片选·低有效</text>
    <text x="418" y="668" fill="#5b21b6" text-anchor="middle">选中本屏</text>
    <rect x="370" y="676" width="96" height="34" rx="3" fill="#faf5ff" stroke="#8b5cf6"/>
    <text x="418" y="690" font-size="10" font-weight="700" fill="#6d28d9" text-anchor="middle">接开发板</text>
    <text x="418" y="703" font-size="11" font-weight="700" fill="#6d28d9" text-anchor="middle">GPIO10</text>

    <rect x="474" y="632" width="112" height="86" rx="4" fill="#ede9fe"/>
    <text x="530" y="650" fill="#5b21b6" text-anchor="middle">数据/命令选择</text>
    <text x="530" y="668" fill="#5b21b6" text-anchor="middle">高=数据 低=命令</text>
    <rect x="482" y="676" width="96" height="34" rx="3" fill="#faf5ff" stroke="#8b5cf6"/>
    <text x="530" y="690" font-size="10" font-weight="700" fill="#6d28d9" text-anchor="middle">接开发板</text>
    <text x="530" y="703" font-size="11" font-weight="700" fill="#6d28d9" text-anchor="middle">GPIO13</text>

    <rect x="586" y="632" width="112" height="86" rx="4" fill="#ede9fe"/>
    <text x="642" y="650" fill="#5b21b6" text-anchor="middle">硬件复位</text>
    <text x="642" y="668" fill="#5b21b6" text-anchor="middle">低电平复位</text>
    <rect x="594" y="676" width="96" height="34" rx="3" fill="#faf5ff" stroke="#8b5cf6"/>
    <text x="642" y="690" font-size="10" font-weight="700" fill="#6d28d9" text-anchor="middle">接开发板</text>
    <text x="642" y="703" font-size="11" font-weight="700" fill="#6d28d9" text-anchor="middle">GPIO14</text>

    <rect x="698" y="632" width="112" height="86" rx="4" fill="#dbeafe"/>
    <text x="754" y="650" fill="#1e3a8a" text-anchor="middle">SPI 数据 SDA</text>
    <text x="754" y="668" fill="#1e3a8a" text-anchor="middle">主控→屏幕</text>
    <rect x="706" y="676" width="96" height="34" rx="3" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="754" y="690" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">接开发板</text>
    <text x="754" y="703" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">GPIO11</text>

    <rect x="810" y="632" width="112" height="86" rx="4" fill="#dbeafe"/>
    <text x="866" y="650" fill="#1e3a8a" text-anchor="middle">SPI 时钟 SCLK</text>
    <text x="866" y="668" fill="#1e3a8a" text-anchor="middle">同步信号</text>
    <rect x="818" y="676" width="96" height="34" rx="3" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="866" y="690" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">接开发板</text>
    <text x="866" y="703" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">GPIO12</text>

    <rect x="922" y="632" width="112" height="86" rx="4" fill="#fef3c7"/>
    <text x="978" y="650" fill="#78350f" text-anchor="middle">电源正极</text>
    <text x="978" y="668" fill="#78350f" text-anchor="middle">必须 3.3V</text>
    <rect x="930" y="676" width="96" height="34" rx="3" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="978" y="690" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle">接开发板</text>
    <text x="978" y="703" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">3V3 脚</text>

    <rect x="1034" y="632" width="112" height="86" rx="4" fill="#e2e8f0"/>
    <text x="1090" y="650" fill="#334155" text-anchor="middle">电源地</text>
    <text x="1090" y="668" fill="#334155" text-anchor="middle">与主控共地</text>
    <rect x="1042" y="676" width="96" height="34" rx="3" fill="#f8fafc" stroke="#64748b"/>
    <text x="1090" y="690" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">接开发板</text>
    <text x="1090" y="703" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">GND 脚</text>
  </g>

  <!-- 接口说明条 -->
  <rect x="200" y="745" width="1100" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="220" y="770" font-size="13" font-weight="700" fill="#0f172a">接口说明</text>
  <text x="220" y="792" font-size="12" fill="#475569">SPI 4线(SCLK/SDA/CS/DC) · 无 MISO 只写不读 · 240×320 RGB565 · ST7789 · 3.3V · 背光≈20mA · 库：TFT_eSPI / LovyanGFX</text>

  <!-- 底部注意事项 -->
  <rect x="40" y="830" width="1420" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="865" font-size="16" font-weight="700" fill="#0f172a">⚠ 注意事项</text>
  <text x="60" y="895" font-size="13" fill="#475569">1. 供电必须 3.3V，接 5V 会烧屏；GND 与主控共地。</text>
  <text x="60" y="920" font-size="13" fill="#475569">2. 排针方向：屏幕面朝自己时，排针在下方，从左到右 BLK(8)→GND(1)；翻到背面看丝印顺序相反。接线前对照模块背面丝印。</text>
  <text x="60" y="945" font-size="13" fill="#475569">3. 本模块 8Pin 顺序：GND·3V3·SCLK·SDA·RESET·DC·CS·BLK（编号 1~8）。图中"接开发板"为本项目当前分配，改接线时同步更新。</text>
  <text x="60" y="970" font-size="13" fill="#475569">4. BLK 接 3.3V 常亮；接 GPIO 输出 PWM 可调亮度。DC/RESET/CS 必须接主控 GPIO，不能悬空。</text>
</svg>
