  <text x="60" y="1045" font-size="12" fill="#475569">⚠ N16R8 的 8MB OPI PSRAM 硬件占用 GPIO33~37，虽引出但不可作普通 IO。烧录插「UART 口」(走板载 CH340)，「USB 口」暂作 OTG 备用。</text>
