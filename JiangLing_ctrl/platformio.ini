[env:esp32-s3-jiangling]
# PlatformIO 环境名称；执行 pio run -e esp32-s3-jiangling 时选择此配置。
# platform/board/framework 分别指定芯片平台、板型定义和 Arduino 核心框架。
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

# monitor_speed 是串口波特率，必须与 src/config.h 的 SERIAL_BAUD_RATE 相同。
# upload_port/monitor_port 是烧录和查看串口日志所用的 Windows COM 端口。
monitor_speed = 115200
upload_port = COM3
monitor_port = COM3

# build_flags 会作为编译器宏传给本项目和依赖库。
# -DNAME=VALUE 类似在代码里写 #define NAME VALUE，但由构建配置集中提供。
build_flags =
    ; USB CDC 不在启动时占用串口，便于使用 UART0 输出调试信息。
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; 启用 PSRAM 支持；实际内存类型在下方 board_build.arduino.memory_type 中指定。
    -DBOARD_HAS_PSRAM
    ; 告知 TFT_eSPI 使用此处直接定义的驱动/引脚，不再读取库里的 User_Setup。
    -DUSER_SETUP_LOADED=1
    ; 屏幕驱动型号、颜色反相设置和分辨率。
    -DST7789_DRIVER
    -DTFT_INVERSION_OFF
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    ; TFT_eSPI 要求使用 TFT_* 名称；修改时也要同步修改 src/base/m.h 的 PIN_* 并重新接线。
    ; 2026-11 重排：屏幕 6 条信号集中在左侧排针的 GPIO9~GPIO14。
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=13
    -DTFT_RST=14
    -DTFT_BL=9
    ; 背光高电平点亮；选择 ESP32-S3 的 SPI 主机端口，并设置读写时钟。
    -DTFT_BACKLIGHT_ON=HIGH
    -DUSE_HSPI_PORT
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    ; 编译进 TFT_eSPI 的内置字体；SMOOTH_FONT 用于从 SPIFFS 加载 VLW 平滑字体。
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_GFXFF
    -DSMOOTH_FONT

# ESP32-S3 的 PSRAM/Flash 工作模式与 Flash 时钟；需与实际模组硬件相符。
board_build.arduino.memory_type = dio_opi
board_build.flash_mode = dio
board_build.f_flash = 40000000L

# 当前板型为 ESP32-S3-DevKitC-1-N8，实际 Flash 为 8 MB。
# 单应用分区为固件和 1.9 MB 中文字库分别保留足够空间；不要改回 16 MB 默认分区表。
board_upload.flash_size = 8MB
board_build.partitions = partitions_8MB.csv
board_build.filesystem = spiffs

# 项目直接依赖的库；BLE/SPIFFS 来自 ESP32 Arduino 框架。
# AI 通道：WebSocket 客户端 + JSON 解析。
# Opus 编解码库拿不到（GitHub 不可达、registry 包超时），当前用 PCM 直通，
# 接入点集中在 src/ai/Codec.cpp；ESP-SR 唤醒词需要 model 分区，默认关闭。
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    links2004/WebSockets @ ^2.7.3
    bblanchon/ArduinoJson @ ^7.0.0

# extra_scripts 让 PlatformIO 在构建前运行 Python 脚本，修补当前板子的 XMC Flash 启动兼容问题。
extra_scripts = scripts/patch_bootloader.py
